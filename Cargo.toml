[package]
name = "endchat"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "signal"] }
toml = "1.1.7"

[dev-dependencies]
tempfile = "3.27.0"
