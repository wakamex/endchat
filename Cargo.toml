[package]
name = "endchat"
version = "0.1.0"
description = "A chat that never ends: memory kept as a tree of summaries, every model call made through AOP"
license = "MIT AND Apache-2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "signal"] }
toml = "1.1.7"
